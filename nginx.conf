server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /worker-basic.min.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /safety-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* "-[a-z0-9_-]{8,}\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(html|json|webmanifest|js|css|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
}
